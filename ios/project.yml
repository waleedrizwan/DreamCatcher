name: DreamCatcher
options:
  bundleIdPrefix: com.waleedrizwan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SnoreCore:
    path: Packages/SnoreCore
  SnoreAudio:
    path: Packages/SnoreAudio
  SnoreStorage:
    path: Packages/SnoreStorage

targets:
  DreamCatcher:
    type: application
    platform: iOS
    sources:
      - DreamCatcher
    dependencies:
      - package: SnoreCore
      - package: SnoreAudio
      - package: SnoreStorage
    info:
      path: DreamCatcher/Info.plist
      properties:
        CFBundleDisplayName: Dream Catcher
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        # Zero networking and no custom cryptography, so the export-compliance
        # question is answered in the bundle instead of on every upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The standard, App-Review-accepted mechanism for overnight recorder
        # apps (design-ios §2.2): with running audio input, the app is not
        # suspended when the screen locks.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          Dream Catcher listens overnight to detect snoring. Audio is
          analyzed on your phone; only short snore clips are saved, and audio
          never leaves your device.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Apple Developer team. Automatic signing creates the certificate and
        # provisioning profile on first device build.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CCY6PYVHZW
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "1.0.0"
