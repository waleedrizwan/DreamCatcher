name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: SnoreCore tests (detector vs golden fixtures)
        run: swift test --package-path ios/Packages/SnoreCore
      - name: SnoreStorage tests
        run: swift test --package-path ios/Packages/SnoreStorage
      - name: Build the app (unsigned)
        run: scripts/build-ipa.sh
