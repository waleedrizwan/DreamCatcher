name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build unsigned IPA
        run: scripts/build-ipa.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" build/DreamCatcher.ipa \
            --title "Dream Catcher $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
